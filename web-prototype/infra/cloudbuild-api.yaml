steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=pipeline/web-prototype/docker/api.Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
# The image holds only the app, node_modules and the engine package (tens of
# MB); baked fighters are served from the bucket (docker/api.Dockerfile).
timeout: 1200s
options:
  machineType: E2_HIGHCPU_8
