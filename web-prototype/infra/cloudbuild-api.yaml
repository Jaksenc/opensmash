steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=pipeline/web-prototype/docker/api.Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
# The image carries ~1000 baked fighters (a few GB); the default 10-minute
# build timeout is not enough to copy and push it.
timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
