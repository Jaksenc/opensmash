<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro 3D Buttons Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --panel: #100b08;
      --panel-edge: #3a2518;
      --cream: #fff0c2;
      --muted: #ad9880;
    }

    * { box-sizing: border-box; }

    html { background: #050302; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(103, 52, 20, .22), transparent 42rem),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .012) 0 2px, transparent 2px 8px),
        #050302;
      color: var(--cream);
      font-family: "Kanit", system-ui, sans-serif;
    }

    button, input { font: inherit; }

    .playground {
      width: min(1480px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 54px;
    }

    .playground-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #d0a35e;
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 38px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.035em;
    }

    .playground-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 10px;
      border: 1px solid #3b2a1c;
      background: rgba(13, 8, 5, .85);
      color: var(--muted);
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }

    .playground-controls label {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .playground-controls input { accent-color: #e8b426; }
    .playground-controls input[type="range"] { width: 80px; }

    .comparison-layout {
      display: grid;
      grid-template-columns: minmax(360px, .82fr) minmax(680px, 1.18fr);
      gap: 14px;
      align-items: start;
    }

    .reference-card,
    .site-slice {
      overflow: hidden;
      border: 1px solid var(--panel-edge);
      background: #050302;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48);
    }

    .reference-card {
      margin: 0;
    }

    .comparison-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
      padding: 8px 11px;
      border-bottom: 1px solid #392319;
      background: linear-gradient(#1c100a, #0c0705);
      color: #e5ba73;
      font: 800 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .comparison-label small {
      color: #816e5c;
      font: inherit;
      letter-spacing: .03em;
      text-transform: none;
    }

    .reference-image-stage {
      display: grid;
      place-items: center;
      min-height: 198px;
      padding: 20px;
      background:
        repeating-linear-gradient(45deg, #090909 0 8px, #0d0d0d 8px 16px),
        #080808;
    }

    .reference-image-stage img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .reference-notes {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 13px 15px 15px;
      border-top: 1px solid #26170f;
      color: #988572;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .reference-notes div {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 10px;
    }

    .reference-notes dt { color: #d0a35e; }
    .reference-notes dd { margin: 0; }

    .video-preview {
      position: relative;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      border-bottom: 2px solid #28150d;
      background:
        radial-gradient(circle at 50% 50%, #24201e 0 8%, transparent 31%),
        linear-gradient(135deg, #111 0 38%, #292929 48%, #0a0a0a 67%);
    }

    .video-preview video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.9) contrast(1.08) brightness(.72);
    }

    .video-preview::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, .16) 2px 3px),
        radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .48));
      mix-blend-mode: multiply;
    }

    .video-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 1;
      margin: 0;
      color: rgba(255, 240, 194, .8);
      font: 800 italic clamp(16px, 3vw, 29px)/1 "Kanit", sans-serif;
      letter-spacing: -.03em;
      text-shadow: 0 3px 0 #28100a, 0 0 12px rgba(255, 110, 34, .42);
      transform: skewX(-5deg);
    }

    .button-stage {
      position: relative;
      height: 94px;
      overflow: hidden;
      border-bottom: 2px solid #26140c;
      background:
        radial-gradient(ellipse at center, rgba(90, 39, 12, .24), transparent 66%),
        linear-gradient(#090604, #030201);
      isolation: isolate;
    }

    #retro-button-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .button-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.4vw, 28px);
      height: 100%;
      padding: 15px 24px 19px;
    }

    .retro-button {
      position: relative;
      width: clamp(220px, 31vw, 286px);
      height: 58px;
      flex: 0 1 286px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      outline: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .retro-button::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 2px solid transparent;
      border-radius: inherit;
      pointer-events: none;
    }

    .retro-button:focus-visible::after {
      border-color: #fff8bd;
      box-shadow: 0 0 0 2px #4d2400, 0 0 14px rgba(255, 225, 86, .65);
    }

    .search-preview {
      position: relative;
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 clamp(16px, 3vw, 28px);
      overflow: hidden;
      background:
        radial-gradient(ellipse at 14% 120%, rgba(255, 64, 0, .76), transparent 31%),
        radial-gradient(ellipse at 72% 135%, rgba(255, 126, 0, .52), transparent 37%),
        linear-gradient(#250a04, #080201 73%);
    }

    .search-preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(105deg, transparent 0 46px, rgba(255, 149, 51, .08) 47px 50px),
        repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .16) 3px 4px);
      pointer-events: none;
    }

    .search-preview input {
      position: relative;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff2d6;
      font: 700 clamp(17px, 2.5vw, 25px)/1 "Kanit", sans-serif;
      text-shadow: 0 2px 0 #260500;
    }

    .search-preview input::placeholder { color: #fff2d6; opacity: .9; }

    .playground-footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 12px;
      color: var(--muted);
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #event-status { color: #e8bd6c; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 620px) {
      .playground-header { align-items: start; flex-direction: column; }
      .button-stage { height: 220px; }
      .button-row { flex-direction: column; gap: 8px; padding: 12px 20px 16px; }
      .retro-button { width: min(286px, 82vw); min-height: 58px; flex-basis: 58px; }
      .video-preview { aspect-ratio: 4 / 3; }
      .playground-footer { flex-direction: column; gap: 5px; }
    }

    @media (max-width: 1100px) {
      .comparison-layout { grid-template-columns: 1fr; }
      .reference-image-stage img { width: min(730px, 100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
  </script>
</head>
<body>
  <main class="playground">
    <header class="playground-header">
      <div>
        <p class="eyebrow">Isolated visual test</p>
        <h1>Retro 3D button playground</h1>
      </div>
      <div class="playground-controls" aria-label="Preview settings">
        <label><input id="post-toggle" type="checkbox" checked> Pixel pass</label>
        <label>Pixel size <input id="pixel-size" type="range" min="1" max="4" step="1" value="2"></label>
      </div>
    </header>

    <div class="comparison-layout">
      <figure class="reference-card">
        <figcaption class="comparison-label">
          Source reference
          <small>Original crop · 730 × 198</small>
        </figcaption>
        <div class="reference-image-stage">
          <img src="../assets/reference/stock-button-source.png"
               alt="Source game UI showing the gold Stock 3 selector">
        </div>
        <dl class="reference-notes">
          <div><dt>Button type</dt><dd>Pre-rendered 3D capsule with a low-resolution composite pass</dd></div>
          <div><dt>Typeface</dt><dd>Reference-style heavy italic display lettering</dd></div>
          <div><dt>Our labels</dt><dd>Kanit 500 in all caps, using a lightened gold from the capsule palette</dd></div>
          <div><dt>Search bar</dt><dd>Kanit 600 in production; same family, lighter treatment</dd></div>
        </dl>
      </figure>

      <section class="site-slice" aria-label="Live page placement preview">
        <div class="comparison-label">
          Live playground
          <small>Real HTML controls + Three.js visual layer</small>
        </div>
        <div class="video-preview" aria-label="Video placeholder">
          <video src="../assets/intro-crt.mp4" muted autoplay loop playsinline></video>
          <p class="video-badge">SMASH THE WEIGHTS</p>
        </div>

        <section id="button-stage" class="button-stage" aria-label="Menu controls">
          <canvas id="retro-button-canvas" aria-hidden="true"></canvas>
          <div class="button-row">
            <button class="retro-button" type="button" data-retro-label="About">
              <span class="visually-hidden">About</span>
            </button>
            <button class="retro-button" type="button" data-retro-label="Controls">
              <span class="visually-hidden">Controls</span>
            </button>
            <button class="retro-button" type="button" data-retro-label="Advanced" aria-expanded="false">
              <span class="visually-hidden">Advanced</span>
            </button>
          </div>
        </section>

        <label class="search-preview">
          <span class="visually-hidden">Search fighters</span>
          <input type="search" placeholder="Search Fighters…">
        </label>
      </section>
    </div>

    <footer class="playground-footer">
      <span>Hover, press, tab, or activate either real HTML button.</span>
      <output id="event-status" aria-live="polite">Ready</output>
    </footer>
  </main>

  <script type="module" src="./retro-buttons.js"></script>
</body>
</html>
