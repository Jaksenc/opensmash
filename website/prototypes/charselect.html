<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSmash — Character Select</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b0603;
    display: flex; align-items: center; justify-content: center;
    padding: 2vmin;
    overflow: auto;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr));
    gap: 0;                              /* frames butt together, as in-game */
    width: min(96vw, 168vh);
    background: #170d07;
    padding: 0.4vmin;
  }

  .slot {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 47 / 45;               /* interior + shared lattice */
    padding: 0; border: 0; background: none;
    cursor: pointer;
    line-height: 0;
  }
  /* the pixel art: nearest-neighbour upscale, no smoothing anywhere */
  .slot canvas {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .slot .sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
              clip: rect(0 0 0 0); white-space: nowrap; }

  /* selection / hover highlight, drawn as an overlay so it stays crisp */
  .slot::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 2px transparent;
  }
  .slot:hover::after, .slot[data-selected]::after {
    box-shadow: inset 0 0 0 2px #ffe9a8, 0 0 10px 1px rgba(255,205,120,.5);
  }
  .slot:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div id="grid" role="grid" aria-label="character select"></div>

<script type="module">
const { IW, IH, TW, TH, EDGE, FIRE_SEED, renderTile, bufToCanvas } =
  await import('./cell.js' + location.search);   // search doubles as cache-buster

const P = new URLSearchParams(location.search);
const N = Math.max(1, parseInt(P.get('n') || '100', 10));
const COLS = parseInt(P.get('cols') || '0', 10) || Math.min(10, Math.ceil(Math.sqrt(N)));
const GRADE = P.get('grade') === '1';

const NAMES = ['MARIO','DK','LINK','SAMUS','YOSHI','KIRBY','FOX','PIKACHU',
               'LUIGI','FALCON','NESS','PUFF'];

const grid = document.getElementById('grid');
grid.style.setProperty('--cols', COLS);

for (let i = 0; i < N; i++) {
  const name = i < NAMES.length ? NAMES[i] : null;
  const b = document.createElement('button');
  b.className = 'slot';
  b.dataset.slot = i;
  if (name) b.dataset.name = name;
  b.setAttribute('role', 'gridcell');
  b.setAttribute('aria-label', name || 'empty slot ' + (i + 1));
  b.appendChild(bufToCanvas(renderTile(FIRE_SEED, name, !name)));
  const sr = document.createElement('span');
  sr.className = 'sr';
  sr.textContent = name || '';
  b.appendChild(sr);
  b.addEventListener('click', () => {
    for (const o of grid.querySelectorAll('[data-selected]')) delete o.dataset.selected;
    b.dataset.selected = '1';
  });
  grid.appendChild(b);
}

// ── grader hook: post the raw interior pixels for tools/grade_grid.py ──────
window.exportTiles = async () => {
  const send = async (buf, tag) => {
    const out = new Uint8Array(IW * IH * 4);
    for (let y = 0; y < IH; y++)
      for (let x = 0; x < IW; x++) {
        const s = (y * buf.w + x) * 4, d = (y * IW + x) * 4;
        for (let k = 0; k < 4; k++) out[d + k] = buf.d[s + k];
      }
    await fetch('http://127.0.0.1:8602/' + tag + '_' + IW + 'x' + IH + '.raw',
                { method: 'POST', body: out });
  };
  await send(renderTile(3, null, false), 'tile_fire');
  await send(renderTile(3, 'MARIO', false), 'tile_label');
  return 'exported';
};
if (GRADE) window.exportTiles();
</script>
</body>
</html>
