<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSmash — Character Select</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 10%, #2a130c 0%, #180a06 55%, #0c0503 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    overflow: auto;
  }

  /* ── grid ──────────────────────────────────────────────────────────── */
  #grid {
    display: grid;
    /* cols set from JS (?cols=) or auto-fit responsive */
    grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr));
    gap: 0.35vmin;
    width: min(96vw, 170vh);
    background: #1b0e08;
    padding: 0.5vmin;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8) inset, 0 4px 24px rgba(0,0,0,0.6);
  }

  .slot {
    position: relative;
    aspect-ratio: 45 / 43;               /* the game's portrait tile ratio */
    border: none;
    padding: 0;
    background: #000;
    cursor: pointer;
    display: block;
    width: 100%;
    /* wood frame: dark brown with a subtle bevel, like the game's grid */
    outline: 2px solid #35201411;
    box-shadow:
      inset 0 0 0 2px #3a241733,
      0 0 0 1px #120a06;
    border-radius: 2px;
    overflow: hidden;
  }
  .slot svg { display: block; width: 100%; height: 100%; }

  /* hover / selected ring, like the in-game cursor highlight */
  .slot:hover, .slot[data-selected] {
    z-index: 2;
    box-shadow:
      0 0 0 2px #f8f0d8,
      0 0 12px 2px rgba(255, 220, 140, 0.55),
      inset 0 0 0 1px #120a06;
  }
  .slot:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div id="grid" role="grid" aria-label="character select"></div>

<script>
// ---------------------------------------------------------------------------
// N-cell character-select grid, built entirely from DOM + SVG — no bitmaps.
// ?n=100   number of slots
// ?cols=10 columns (defaults to a near-square layout)
// ?grade=1 grader mode: renders one bare fire tile at a fixed rect
// Each slot is a real <button data-slot="i"> — fully targetable.
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const N = Math.max(1, parseInt(params.get('n') || '100', 10));
const COLS = parseInt(params.get('cols') || '0', 10) ||
  Math.ceil(Math.sqrt(N * (43 * 1.0) / 45));
const GRADE = params.get('grade') === '1';

// Demo names for the first few slots; the rest get the "?" placeholder.
const NAMES = ['MARIO', 'DK', 'LINK', 'SAMUS', 'YOSHI', 'KIRBY', 'FOX',
               'PIKACHU', 'LUIGI', 'FALCON', 'NESS', 'PUFF'];

// ── fire tile: original SVG artwork tuned to the game's palette ─────────────
// Deep near-black top, ember maroon glow, flame tongues rising from the
// bottom, displaced organically per-slot with feTurbulence (seeded).
function fireTileSVG(seed, { name = null, qmark = false } = {}) {
  const flameJitter = (seed * 7919) % 13;
  return `
<svg viewBox="0 0 45 43" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg${seed}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#120302"/>
      <stop offset="0.35" stop-color="#240604"/>
      <stop offset="0.7"  stop-color="#3a0c05"/>
      <stop offset="1"    stop-color="#521408"/>
    </linearGradient>
    <linearGradient id="fl${seed}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"    stop-color="#a82c0c"/>
      <stop offset="0.45" stop-color="#831c08"/>
      <stop offset="0.8"  stop-color="#520e04"/>
      <stop offset="1"    stop-color="#26050188"/>
    </linearGradient>
    <linearGradient id="core${seed}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#d85c14"/>
      <stop offset="0.55" stop-color="#a83408"/>
      <stop offset="1"   stop-color="#6c160566"/>
    </linearGradient>
    <linearGradient id="hot${seed}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#f4c244"/>
      <stop offset="0.45" stop-color="#e07c18"/>
      <stop offset="1"   stop-color="#b2400c66"/>
    </linearGradient>
    <filter id="grain${seed}">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2"
                    seed="${seed + 41}"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.55  0 0 0 0 0.22  0 0 0 0 0.08  0.6 0 0 0 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="warp${seed}" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10 0.16"
                    numOctaves="2" seed="${seed}" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="${5 + flameJitter % 4}"/>
      <feGaussianBlur stdDeviation="0.25"/>
    </filter>
  </defs>

  <rect width="45" height="43" fill="#1c0502"/>
  <rect width="45" height="43" fill="url(#bg${seed})"/>

  <!-- flame bank: a few fat asymmetric columns, dark void upper-left,
       dark pocket bottom-right, hot mass low center-left -->
  <g filter="url(#warp${seed})">
    <path d="M -2,46 L -2,26 Q 2,22 4,25 Q 7,8 12,20 Q 15,4 19,18
             Q 23,10 26,20 Q 30,7 35,19 Q 39,14 42,22 Q 45,18 48,24
             L 48,46 Z" fill="url(#fl${seed})"/>
    <path d="M -2,46 L -2,32 Q 3,28 6,31 Q 9,14 14,26 Q 17,10 21,24
             Q 25,17 28,26 Q 32,13 37,25 Q 41,21 48,30 L 48,46 Z"
          fill="url(#core${seed})" opacity="0.95"/>
    <path d="M -2,46 L -2,38 Q 3,34 6,37 Q 10,22 15,32 Q 18,18 22,30
             Q 26,24 30,33 Q 33,26 37,34 Q 41,32 44,38 L 46,42 L 46,46 Z"
          fill="url(#hot${seed})" opacity="0.92"/>
    <!-- dark pocket bottom-right, like the source tile -->
    <path d="M 36,46 Q 38,38 42,40 Q 45,42 48,41 L 48,46 Z"
          fill="#2a0703" opacity="0.85"/>
  </g>
  <!-- subtle grain: widens the tonal distribution like the RGBA16 source -->
  <rect width="45" height="43" filter="url(#grain${seed})" opacity="0.09"/>
  <!-- baked top-edge highlight, as in the game tile -->
  <rect x="0" y="0" width="45" height="1" fill="#b06a3c" opacity="0.85"/>

  ${qmark ? `
  <text x="22.5" y="27.5" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif" font-size="17"
        font-weight="900" fill="#f2ede2"
        stroke="#17090533" stroke-width="1.6" paint-order="stroke"
        >?</text>` : ''}

  ${name ? `
  <text x="2.4" y="8.6" font-family="Arial Black, Arial, sans-serif"
        font-size="7.4" font-weight="900" letter-spacing="0.35"
        fill="#c9b493" stroke="#1c0f08" stroke-width="1.05"
        paint-order="stroke" transform="scale(1, 0.98)"
        textLength="${Math.min(40, name.length * 5.4)}"
        lengthAdjust="spacingAndGlyphs">${name}</text>` : ''}
</svg>`;
}

const grid = document.getElementById('grid');
grid.style.setProperty('--cols', COLS);

if (GRADE) {
  // grader mode: one bare fire tile at a known CSS rect for screenshotting
  document.body.style.cssText = 'background:#222;display:block;padding:0';
  grid.style.cssText = 'display:block;width:auto;background:none;box-shadow:none;padding:0';
  const el = document.createElement('div');
  el.id = 'grade-tile';
  el.style.cssText = 'position:fixed;left:8px;top:8px;width:360px;height:344px';
  el.innerHTML = fireTileSVG(3, {});
  document.body.appendChild(el);
  const el2 = document.createElement('div');
  el2.style.cssText = 'position:fixed;left:400px;top:8px;width:360px;height:344px';
  el2.innerHTML = fireTileSVG(3, { name: 'MARIO' });
  document.body.appendChild(el2);

  // Rasterize the SVG tiles and POST raw RGBA to the scratch save server —
  // exact pixels for the grader, no screenshot cropping.
  window.exportTiles = async () => {
    async function rasterize(svgText, w, h, tag) {
      const blob = new Blob([svgText], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = ctx.getImageData(0, 0, w, h).data;
      await fetch(`http://127.0.0.1:8602/${tag}_${w}x${h}.raw`,
                  { method: 'POST', body: new Uint8Array(data.buffer) });
    }
    await rasterize(fireTileSVG(3, {}), 45, 43, 'tile_fire');
    await rasterize(fireTileSVG(3, { name: 'MARIO' }), 45, 43, 'tile_label');
    await rasterize(fireTileSVG(3, {}), 180, 172, 'tile_fire_big');
    return 'exported';
  };
} else {
  for (let i = 0; i < N; i++) {
    const b = document.createElement('button');
    b.className = 'slot';
    b.dataset.slot = i;
    b.setAttribute('role', 'gridcell');
    const name = i < NAMES.length ? NAMES[i] : null;
    b.setAttribute('aria-label', name || `slot ${i + 1}`);
    b.innerHTML = fireTileSVG(i + 1, { name, qmark: !name });
    b.addEventListener('click', () => {
      for (const o of grid.querySelectorAll('[data-selected]'))
        delete o.dataset.selected;
      b.dataset.selected = '1';
    });
    grid.appendChild(b);
  }
}
</script>
</body>
</html>
