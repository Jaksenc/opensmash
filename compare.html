<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cell compare — game vs ours</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#141014; color:#d8cfc2; font:13px/1.5 ui-monospace,Menlo,monospace;
         padding:18px; }
  h1 { font-size:14px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
       color:#8f8577; margin-bottom:14px; }
  .row { display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; margin-bottom:22px; }
  .pane { }
  .pane h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
             color:#7d7365; margin-bottom:6px; font-weight:600; }
  .shot { image-rendering:pixelated; image-rendering:crisp-edges;
          display:block; border:1px solid #2a2420; }
  .diffbar { margin-top:10px; font-size:12px; color:#a89c8c; }
  .swatches { display:flex; gap:2px; margin-top:6px; }
  .sw { width:26px; height:26px; border:1px solid #000; }
</style>
</head>
<body>
  <h1>Character-select cell — game reference vs our procedural build</h1>
  <div class="row" id="row"></div>
  <div class="row" id="row2"></div>
  <div class="diffbar" id="stats"></div>

<script type="module">
import { IW, IH, TW, TH, FIRE_SEED, renderTile, bufToCanvas } from './cell.js';

const SCALE = 6;
function pane(title, canvas) {
  const d = document.createElement('div'); d.className = 'pane';
  const h = document.createElement('h2'); h.textContent = title;
  canvas.className = 'shot';
  canvas.style.width = (canvas.width * SCALE) + 'px';
  canvas.style.height = (canvas.height * SCALE) + 'px';
  d.append(h, canvas); return d;
}
// our tile, interior only (drop the shared lattice so both are 45x43)
function ourTile(name, q) {
  const b = renderTile(FIRE_SEED, name, q);
  const cv = document.createElement('canvas');
  cv.width = IW; cv.height = IH;
  const src = bufToCanvas(b);
  cv.getContext('2d').drawImage(src, 0, 0, IW, IH, 0, 0, IW, IH);
  return cv;
}
// the game reference is loaded ONLY here, in this grading harness —
// charselect.html itself never touches an asset file.
function refTile(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = IW; cv.height = IH;
      const c = cv.getContext('2d');
      c.imageSmoothingEnabled = false;
      c.drawImage(img, 0, 0);
      res(cv);
    };
    img.src = src;
  });
}

const gameFire = await refTile('assets/charselect/fire_bg.png');
const row = document.getElementById('row');
row.append(pane('game — fire_bg', gameFire));
row.append(pane('ours — fire', ourTile(null, false)));
row.append(pane('ours — with name', ourTile('MARIO', false)));
row.append(pane('ours — empty slot', ourTile(null, true)));

// 2x2 block so the shared lattice / cell borders are visible
function ourBlock(names) {
  const cv = document.createElement('canvas');
  cv.width = TW * 2; cv.height = TH * 2;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  names.forEach((nm, i) => {
    c.drawImage(bufToCanvas(renderTile(FIRE_SEED, nm, !nm)),
                (i % 2) * TW, ((i / 2) | 0) * TH);
  });
  return cv;
}
row.append(pane('ours — 2x2, shared borders', ourBlock(['MARIO','DK',null,null])));

// name label reference beside our font
const gameName = await refTile('assets/charselect/grid_mario.png');
const row2 = document.getElementById('row2');
row2.append(pane('game — name sprite (tinted in-game)', gameName));
row2.append(pane('ours — name only', (() => {
  const b = renderTile(FIRE_SEED, 'MARIO', false);
  const cv = document.createElement('canvas'); cv.width = IW; cv.height = 14;
  cv.getContext('2d').drawImage(bufToCanvas(b), 0, 0, IW, 14, 0, 0, IW, 14);
  return cv;
})()));

// quick numeric diff on the visible band (rows 2..41; the top/bottom tile
// edges are covered by the lattice in the real screen)
function px(cv) { return cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data; }
const A = px(gameFire), B = px(ourTile(null, false));
let n = 0, dr = 0, dg = 0, db = 0;
for (let y = 2; y < IH - 1; y++) for (let x = 0; x < IW; x++) {
  const i = (y * IW + x) * 4;
  dr += Math.abs(A[i] - B[i]); dg += Math.abs(A[i+1] - B[i+1]); db += Math.abs(A[i+2] - B[i+2]); n++;
}
document.getElementById('stats').textContent =
  `mean per-pixel |Δ| over the visible band: R ${(dr/n).toFixed(1)}  G ${(dg/n).toFixed(1)}  B ${(db/n).toFixed(1)}`;
</script>
</body>
</html>
